services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: sandbox-web-container
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${SANDBOX_API_URL:-http://localhost:8080}
    volumes:
      - ./web:/app
      - /app/node_modules
      - pnpm-store:/pnpm/store
    ports:
      - 3000:3000
    working_dir: /app
    command: bash -c "pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0 --port 3000"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sandbox-api-container
    env_file:
      - ./api/.env.local
    environment:
      - FRONTEND_URL=${SANDBOX_FRONTEND_URL:-http://localhost:3000}
      - GOOGLE_REDIRECT_URL=${SANDBOX_API_URL:-http://localhost:8080}/auth/google/callback
      - DATABASE_URL=postgres://postgres:password@db:5432/test?sslmode=disable
      - PASSKEY_RP_ID=${SANDBOX_RP_ID:-localhost}
      - PASSKEY_RP_ORIGIN=${SANDBOX_FRONTEND_URL:-http://localhost:3000}
    ports:
      - 8080:8080

  db:
    image: postgres:17.1
    container_name: sandbox-db-container
    environment:
      - POSTGRES_DB=test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - database:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pnpm-store:
    name: pnpm-store
  database:
    name: postgresql_initial_data
