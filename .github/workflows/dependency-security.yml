name: Security audit
on:
  schedule:
    - cron: "30 0 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-audit:
    name: web dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web/

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run dependency audit
        run: pnpm audit --prod --audit-level high

  api-audit:
    name: API dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: api/

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          working_directory: api
          cache: true
          install: true

      - name: Install dependencies
        run: mise run install

      - name: Run dependency audit
        run: mise run vulncheck

  web-container-audit:
    name: web container audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: web-audit

    defaults:
      run:
        working-directory: web/

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build container image
        run: docker build -t sandbox-auth-web:security-${{ github.sha }} .

      - name: Scan container image
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: sandbox-auth-web:security-${{ github.sha }}
          trivy-config: trivy.yaml

  api-container-audit:
    name: API container audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: api-audit

    defaults:
      run:
        working-directory: api/

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build container image
        run: docker build -t sandbox-auth-api:security-${{ github.sha }} .

      - name: Scan container image
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: sandbox-auth-api:security-${{ github.sha }}
          trivy-config: trivy.yaml
