[tools]
go = "1.27.1"
golangci-lint = "2.13.2"
air = "1.67.4"
"go:entgo.io/ent/cmd/ent" = "v0.14.6"
"go:github.com/pressly/goose/v3/cmd/goose" = "v3.28.0"

[env]
_.file = ".env.local"

[tasks.dev]
run = "air"

[tasks.build]
run = "go build -o ./tmp/ ./src"

[tasks.run]
run = "go run src/main.go"

[tasks.install]
run = "go mod tidy"

[tasks.update]
run = "go get -u ./..."

[tasks."migrate:up"]
run = "goose -dir ./migrations postgres \"$DATABASE_URL\" up"

[tasks."migrate:down"]
run = "goose -dir ./migrations postgres \"$DATABASE_URL\" down"

[tasks.format]
run = "go fmt ./..."

[tasks."format:check"]
run = "test -z \"$(gofmt -l .)\""

[tasks.lint]
run = "golangci-lint run ./..."

[tasks."lint:config-chk"]
run = "golangci-lint config verify"

[tasks.test]
run = "go test ./..."

[tasks.vulncheck]
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./..."

[tasks.ci]
run = [
  { tasks = [
    "format",
    "lint",
    "test",
    "vulncheck",
  ] },
]
