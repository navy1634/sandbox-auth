[tools]
kubectl = "1.36.3"

[env]
_.file = ".env"

[tasks."render"]
run = "kubectl kustomize manifests/overlays/$ENVIRONMENT"

[tasks."apply"]
run = "kubectl apply -k manifests/overlays/$ENVIRONMENT"

[tasks."connect:db"]
run = "kubectl exec -it -n sandbox-auth statefulset/sandbox-auth-database -- psql -U postgres -d test"
