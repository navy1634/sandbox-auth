apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sandbox-auth-database
  labels:
    app.kubernetes.io/name: sandbox-auth-database
    app.kubernetes.io/part-of: sandbox-auth
spec:
  serviceName: sandbox-auth-database
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-auth-database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-auth-database
        app.kubernetes.io/part-of: sandbox-auth
    spec:
      initContainers:
        - name: database-data-permissions
          image: postgres:17.1
          command:
            - sh
            - -c
            - chown -R 999:999 /var/lib/postgresql/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - DAC_READ_SEARCH
              drop:
                - ALL
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: database-data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: database
          image: postgres:17.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: database
              containerPort: 5432
          envFrom:
            - secretRef:
                name: sandbox-auth-database-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: database-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - test
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - test
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        runAsGroup: 999
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
  volumeClaimTemplates:
    - metadata:
        name: database-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
