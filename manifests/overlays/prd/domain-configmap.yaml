apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-auth-domain-config
data:
  AUTH_HOST: "auth.example.com"
  API_INTERNAL_BASE_URL: "http://sandbox-auth-api.sandbox-auth.svc.cluster.local:8080"
  AUTH_URL: "https://auth.example.com"
  API_URL: "https://auth.example.com/api"
  DEFAULT_REDIRECT_URL: "https://auth.example.com/mypage"
  GOOGLE_REDIRECT_URL: "https://auth.example.com/api/auth/google/callback"
  PASSKEY_RP_ID: "auth.example.com"
  PASSKEY_RP_ORIGIN: "https://auth.example.com"
