apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sandbox-auth
resources:
  - api-configmap.yaml
  - domain-configmap.yaml
  - namespace.yaml
  - web-configmap.yaml
  - ../../base
images:
  - name: sandbox-auth-api
    newName: registry.example.com/sandbox-auth-api
    newTag: latest
  - name: sandbox-auth-web
    newName: registry.example.com/sandbox-auth-web
    newTag: latest
patches:
  - path: replicas-patch.yaml
replacements:
  - source:
      kind: ConfigMap
      name: sandbox-auth-domain-config
      fieldPath: data.AUTH_HOST
    targets:
      - select:
          kind: Ingress
          name: sandbox-auth
        fieldPaths:
          - spec.rules.0.host
