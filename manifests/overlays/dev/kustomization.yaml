apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sandbox-auth
resources:
  - api-configmap.yaml
  - database-persistentvolume.yaml
  - ingress.yaml
  - namespace.yaml
  - web-configmap.yaml
  - ../../base
images:
  - name: sandbox-auth-api
    newName: localhost:5000/sandbox_nextjs-api
    newTag: latest
  - name: sandbox-auth-web
    newName: localhost:5000/sandbox_nextjs-web
    newTag: latest
