apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-auth-api-config
data:
  ADDR: ":8080"
  FRONTEND_URL: "https://auth.sandbox.navy1634.com"
  DEFAULT_REDIRECT_URL: "https://auth.sandbox.navy1634.com/mypage"
  ALLOWED_REDIRECT_URLS: "https://auth.sandbox.navy1634.com/mypage,https://app.sandbox.navy1634.com"
  CORS_ALLOWED_ORIGINS: "https://auth.sandbox.navy1634.com,https://app.sandbox.navy1634.com"
  COOKIE_DOMAIN: "sandbox.navy1634.com"
  DB_HOST: "sandbox-auth-database.sandbox-auth.svc.cluster.local"
  DB_NAME: "test"
  DB_PORT: "5432"
  DB_SSLMODE: "disable"
  GOOGLE_REDIRECT_URL: "https://auth.sandbox.navy1634.com/api/auth/google/callback"
  PASSKEY_RP_ID: "auth.sandbox.navy1634.com"
  PASSKEY_RP_ORIGIN: "https://auth.sandbox.navy1634.com"
  TRUSTED_PROXIES: ""
