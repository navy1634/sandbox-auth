apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-auth-api-config
data:
  ADDR: ":8080"
  FRONTEND_URL: "http://localhost:3000"
  DEFAULT_REDIRECT_URL: "http://localhost:3000/mypage"
  ALLOWED_REDIRECT_URLS: "http://localhost:3000/mypage"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000"
  DB_HOST: "sandbox-auth-database.sandbox-auth.svc.cluster.local"
  DB_NAME: "test"
  DB_PORT: "5432"
  DB_SSLMODE: "disable"
  GOOGLE_REDIRECT_URL: "http://localhost:3000/api/auth/google/callback"
  PASSKEY_RP_ID: "localhost"
  PASSKEY_RP_ORIGIN: "http://localhost:3000"
  TRUSTED_PROXIES: ""
