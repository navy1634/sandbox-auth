apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-auth-domain-config
data:
  AUTH_HOST: "auth.localhost"
  API_INTERNAL_BASE_URL: "http://sandbox-auth-api.sandbox-auth.svc.cluster.local:8080"
  AUTH_URL: "http://localhost:3000"
  API_URL: "http://localhost:3000/api"
  DEFAULT_REDIRECT_URL: "http://localhost:3000/mypage"
  GOOGLE_REDIRECT_URL: "http://localhost:3000/api/auth/google/callback"
  PASSKEY_RP_ID: "localhost"
  PASSKEY_RP_ORIGIN: "http://localhost:3000"
